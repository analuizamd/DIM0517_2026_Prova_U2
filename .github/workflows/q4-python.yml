name: Python

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: Test
        run: pytest

      - name: Docker build
        run: docker build -t api-python .

      - name: Docker run
        run: |
          docker run -d --name api-python -p 8080:8080 api-python
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/healthy && exit 0
            sleep 2
          done
          docker logs api-python
          exit 1
